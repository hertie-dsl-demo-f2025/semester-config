# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This semester: who delivers it, the defaults its assignments run on, and its student
# site. The dates live in schedule.yml; what each assignment IS lives in its template's
# grading_config.yml. Reference: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/preview/docs/05-manage-teaching-team.md
# Worked example: https://github.com/hertie-data-science-lab/dsl-teaching-toolkit/blob/preview/example-course/semester-org/semester.yml

# Who delivers THIS semester: GitHub access, fault mail, the student site's instructor cards.
people:
  - name: "Prof. Lynn Kaack, PhD"
    role: instructor
    title: "Assistant Professor of Computer Science and Public Policy"

defaults:   # every key present; uncomment to override. The comment shows the inherited value and its source.
  # timezone: Europe/Berlin                 (institution)
  # late_window_days: 10                    (course)
  # late_penalty_per_day: 10%               (course)
  # max_team_size: 4                        (course)
  # assignment_repo_visibility: private     (institution)
  # archive_grace_days: 60                  (institution)
  # materials_repo: materials               (institution)
  # autosync_released_edits: false          (institution)
  # marks_per_question: true                (institution)
  team_formation: self_select

# The semester's student site (public, no sign-in).
# student_site:
#   syllabus: SYLLABUS.md             # the released path the home page pins
#   host: {kinds: [lectures, labs, exams, events], types: [html, pdf]}   # viewable copies on this public site; left out = every kind but readings (copyright), html and pdf
